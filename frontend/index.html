<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Hound Around</title>
    <script>
      // Theme before first paint: your saved choice, else the phone's setting.
      (function () {
        var t; try { t = localStorage.getItem('hound.theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.documentElement.style.background = t === 'light' ? '#F1F1EE' : '#0B0B0C'
      })()
    </script>
    <script>
      // Mockup helper: ?font=Inter renders the app in another Google font.
      (function () {
        var q = new URLSearchParams(location.search), ok = /^[A-Za-z ]{2,40}$/
        function load(name, weights) {
          var l = document.createElement('link'); l.rel = 'stylesheet'
          l.href = 'https://fonts.googleapis.com/css2?family=' + name.replace(/ /g, '+') + ':wght@' + weights + '&display=swap'
          document.head.appendChild(l)
        }
        var f = q.get('font'), d = q.get('display'), w = q.get('w')
        if (f && ok.test(f)) { load(f, '400;500;600;700;800;900'); document.documentElement.style.setProperty('--app-font', '"' + f + '"') }
        if (d && ok.test(d)) {
          var wt = /^[1-9]00$/.test(w || '') ? w : '700'
          load(d, wt); document.documentElement.style.setProperty('--app-display', '"' + d + '"')
          document.documentElement.style.setProperty('--display-weight', wt)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
