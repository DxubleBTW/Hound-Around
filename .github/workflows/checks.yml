name: Software checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  private-files:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check_private_files.py

  backend:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q api ml pipeline scripts tests

  frontend:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deployment-smoke:
    if: >-
      vars.HOUND_SMOKE_API_URL != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SMOKE_URL: ${{ vars.HOUND_SMOKE_API_URL }}
      SMOKE_ORIGIN: ${{ vars.HOUND_SMOKE_ORIGIN }}
      SMOKE_FROM: ${{ vars.HOUND_SMOKE_FROM }}
      SMOKE_TO: ${{ vars.HOUND_SMOKE_TO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check deployed service without uploading or correcting photos
        run: |
          args=(--url "$SMOKE_URL" --wait-seconds 90)
          if [ -n "$SMOKE_ORIGIN" ]; then args+=(--origin "$SMOKE_ORIGIN"); fi
          if [ -n "$SMOKE_FROM" ] || [ -n "$SMOKE_TO" ]; then
            args+=(--from-node "$SMOKE_FROM" --to-room "$SMOKE_TO")
          fi
          python3 scripts/smoke_backend.py "${args[@]}"
